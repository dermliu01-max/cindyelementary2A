<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Cindy 的小二複習站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">

<style>
:root{
  --paper:#EFF3F8; --surface:#FFFFFF; --surface-2:#E4EAF3; --surface-3:#F6F9FC;
  --ink:#16233D; --ink-2:#4A5870; --ink-3:#7B889D;
  --line:#D2DBE8; --line-2:#BDC9DA;
  --accent:#2B54C4; --accent-soft:#DEE6FC; --on-accent:#FFFFFF;
  --gold:#B57405; --gold-soft:#FAEED4;
  --good:#1B7F5A; --good-soft:#D7EFE4;
  --bad:#BF3B39; --bad-soft:#FADEDC;
  --s-chinese:#C24A3E; --s-math:#2F5AA8; --s-english:#B67505;
  --s-science:#2A8560; --s-social:#6B4A90; --s-other:#55637C;
  --shadow-1:0 1px 2px rgba(22,35,61,.07);
  --shadow-2:0 2px 4px rgba(22,35,61,.06), 0 10px 26px rgba(22,35,61,.09);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC",Georgia,"Songti TC",serif;
  --font-en:"Andika","Noto Sans TC",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101725; --surface:#1A2436; --surface-2:#232F46; --surface-3:#151E2E;
    --ink:#E9EFF9; --ink-2:#A9B7CD; --ink-3:#7B8AA3;
    --line:#2D3A54; --line-2:#3B4A68;
    --accent:#8AA8FF; --accent-soft:#22304E; --on-accent:#0E1626;
    --gold:#EDB443; --gold-soft:#382C12;
    --good:#4FC796; --good-soft:#123226;
    --bad:#F0837F; --bad-soft:#3B1E1E;
    --s-chinese:#E88C7F; --s-math:#8AA8FF; --s-english:#EDB443;
    --s-science:#5FC698; --s-social:#B695DC; --s-other:#94A3BC;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 2px 4px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#101725; --surface:#1A2436; --surface-2:#232F46; --surface-3:#151E2E;
  --ink:#E9EFF9; --ink-2:#A9B7CD; --ink-3:#7B8AA3;
  --line:#2D3A54; --line-2:#3B4A68;
  --accent:#8AA8FF; --accent-soft:#22304E; --on-accent:#0E1626;
  --gold:#EDB443; --gold-soft:#382C12;
  --good:#4FC796; --good-soft:#123226;
  --bad:#F0837F; --bad-soft:#3B1E1E;
  --s-chinese:#E88C7F; --s-math:#8AA8FF; --s-english:#EDB443;
  --s-science:#5FC698; --s-social:#B695DC; --s-other:#94A3BC;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 2px 4px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-zh); font-size:16px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

.en{font-family:var(--font-en)}
.shell{max-width:900px; margin:0 auto; padding:0 16px 72px}

/* ---------- 注音 ---------- */
.zy{display:inline-flex; align-items:flex-start; line-height:1.1; vertical-align:baseline}
.zy-r{
  font-size:max(10px,.5em); line-height:1.05; margin-left:.06em; margin-right:.05em;
  writing-mode:vertical-rl; text-orientation:upright; text-align:start;
  font-weight:400; letter-spacing:0; color:var(--ink-3);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none; user-select:none;
}
body.zy-on{line-height:2}
body.zy-on .page-head h2,body.zy-on .hero-text h2,body.zy-on .qtext,
body.zy-on .fc .fc-main,body.zy-on .sp-target .zh{line-height:1.6}
body.zy-on .brand h1{line-height:1.5}
body.zy-on .rmain .rw{line-height:1.4}
.zybtn{
  flex:none; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:5px 11px; font-size:13px; min-height:40px; font-weight:700;
  letter-spacing:.04em;
}
.zybtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar-in{max-width:900px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.mark{
  width:38px; height:38px; flex:none; border-radius:12px;
  background:var(--accent); color:var(--on-accent);
  font-family:var(--font-display); font-weight:900; font-size:20px;
  display:grid; place-items:center;
}
.brand h1{margin:0; font-family:var(--font-display); font-size:17px; line-height:1.25}
.brand p{margin:0; font-size:11px; color:var(--ink-3); letter-spacing:.06em}
.topnav{display:flex; gap:4px; flex:none}
.topnav button{background:none; border:0; padding:8px 10px; border-radius:10px; font-size:13px; color:var(--ink-2); min-height:40px}
.topnav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700}

/* ---------- generic ---------- */
.crumb{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:16px 0 4px; font-size:13px; color:var(--ink-3)}
.crumb button{background:none; border:0; padding:6px 0; color:var(--accent); font-size:13px}
.page-head{padding:6px 0 18px; border-bottom:1px solid var(--line); margin-bottom:20px}
.page-head h2{margin:0 0 6px; font-family:var(--font-display); font-size:26px; line-height:1.25; text-wrap:balance}
.page-head p{margin:0; color:var(--ink-2); font-size:14px; max-width:62ch}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:0 0 10px}
.sec{margin:26px 0 0}
.sec > h3{margin:0 0 10px; font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase}
.muted{color:var(--ink-3); font-size:13px}
.note{background:var(--surface-3); border:1px dashed var(--line-2); border-radius:var(--r-m); padding:14px 16px; color:var(--ink-2); font-size:14px}

/* ---------- this week ---------- */
.week-hero{
  background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--gold);
  border-radius:var(--r-l); padding:20px 22px; box-shadow:var(--shadow-1); margin:16px 0 22px;
}
.week-hero .wk-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:2px}
.week-hero .wk-n{font-family:var(--font-display); font-size:24px; line-height:1.2}
.week-hero .wk-d{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.week-hero .wk-u{margin:6px 0 14px; font-size:14px; color:var(--ink-2)}
.week-hero h2{margin:0 0 4px; font-family:var(--font-display); font-size:15px; letter-spacing:.02em}
.sentence-box{
  background:var(--accent-soft); border-radius:var(--r-m); padding:14px 16px; margin-top:14px;
}
.sentence-box .s-en{font-family:var(--font-en); font-weight:700; font-size:18px; line-height:1.4; color:var(--ink)}
.sentence-box .s-zh{font-size:14px; color:var(--ink-2); margin-top:2px}
.exam-flag{
  display:inline-block; background:var(--bad-soft); color:var(--bad); font-weight:700;
  font-size:12px; padding:3px 10px; border-radius:999px;
}

.hero{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:20px 22px; box-shadow:var(--shadow-1); margin:16px 0 24px;
}
.hero-text{flex:1 1 240px; min-width:0}
.hero-text h2{margin:0 0 4px; font-family:var(--font-display); font-size:22px; text-wrap:balance}
.hero-text p{margin:0; color:var(--ink-2); font-size:14px}
.ring{flex:none; display:flex; align-items:center; gap:12px}
.ring svg{display:block}
.ring .rlabel{font-size:12px; color:var(--ink-3); line-height:1.4}
.ring .rlabel b{display:block; font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums}

/* ---------- subject cards ---------- */
.subjects{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.subj{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--sc);
  border-radius:var(--r-m); padding:14px 16px; min-height:76px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.subj:hover{transform:translateY(-2px); box-shadow:var(--shadow-2)}
.subj-ico{
  width:42px; height:42px; flex:none; border-radius:11px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--sc) 15%, transparent); color:var(--sc);
  font-family:var(--font-display); font-weight:900; font-size:17px;
}
.subj-main{flex:1; min-width:0}
.subj-main strong{display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700}
.subj-main .subj-desc{display:block; font-size:12.5px; color:var(--ink-3)}
.subj-arrow{color:var(--ink-3); font-size:18px; flex:none}
.chip-soon{font-size:11px; line-height:1.6; padding:1px 9px; border-radius:999px; flex:none; background:var(--surface-2); color:var(--ink-3); font-weight:500}

/* ---------- rows ---------- */
.rows{display:flex; flex-direction:column; gap:8px}
.row{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:11px 14px; min-height:68px;
}
.row:hover{border-color:var(--line-2)}
.row.now{border-color:var(--gold); border-width:2px; background:var(--gold-soft)}
.row.exam{background:var(--surface-3); border-style:dashed}
.rnum{
  width:40px; height:40px; flex:none; border-radius:11px; display:grid; place-items:center;
  font-family:var(--font-display); font-weight:900; font-size:16px; line-height:1;
  background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums;
}
.row.done .rnum{background:var(--good-soft); color:var(--good)}
.row.now .rnum{background:var(--gold); color:#fff}
.row.exam .rnum{background:var(--bad-soft); color:var(--bad); font-size:13px}
.rmain{flex:1; min-width:0; overflow:hidden}
.rmain .rt{font-size:14.5px; font-weight:700; line-height:1.35}
.rmain .rt .en{font-weight:700}
.rmain .rs{font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rmain .rw{font-family:var(--font-en); font-size:12.5px; color:var(--ink-2); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rtag{flex:none; font-size:11px; padding:2px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-3); font-weight:700}
.rtag.ok{background:var(--good-soft); color:var(--good)}
.bar{height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:6px; max-width:190px}
.bar i{display:block; height:100%; background:var(--gold); border-radius:999px}
.stars{flex:none; font-size:12px; color:var(--gold); letter-spacing:1px}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:2px; background:var(--surface-2); padding:4px; border-radius:var(--r-m); margin-bottom:20px; overflow-x:auto}
.tabs button{flex:1 0 auto; background:none; border:0; padding:9px 14px; border-radius:10px; font-size:14px; color:var(--ink-2); white-space:nowrap; min-height:42px}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow-1)}

/* ---------- reference ---------- */
.kv{display:grid; gap:10px}
.kv-row{display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px}
.kv-row .kv-k{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700; flex:0 0 76px; padding-top:3px}
.kv-row .kv-v{flex:1; min-width:0; font-size:14.5px}

.wordlist{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.wordlist.compact{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.wordlist.compact .w-zh{font-size:12.5px}
.word{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s); padding:9px 10px 9px 12px; min-height:48px}
.word .w-en{font-family:var(--font-en); font-weight:700; font-size:15px; flex:1; min-width:0}
.word .w-zh{font-size:13px; color:var(--ink-2); flex:none}
.speak{flex:none; width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface-3); display:grid; place-items:center; color:var(--ink-2); font-size:14px}
.speak:hover{border-color:var(--accent); color:var(--accent)}
.goal-list{margin:0; padding-left:1.1em; color:var(--ink-2); font-size:14.5px}
.goal-list li{margin:4px 0}
.tag{display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; background:var(--gold-soft); color:var(--gold); font-weight:700; margin:0 6px 6px 0}

/* ---------- sentence list ---------- */
.sent{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px}
.sent.ok{border-color:var(--good); background:var(--good-soft)}
.sent .sn{flex:none; width:28px; height:28px; border-radius:8px; background:var(--surface-2); color:var(--ink-3); display:grid; place-items:center; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
.sent.ok .sn{background:var(--good); color:#fff}
.sent .sm{flex:1; min-width:0}
.sent .sm .se{font-family:var(--font-en); font-weight:700; font-size:15.5px; line-height:1.4}
.sent .sm .sz{font-size:13px; color:var(--ink-2)}
.sent .sa{display:flex; gap:4px; flex:none}

/* ---------- flashcard ---------- */
.fc-wrap{display:flex; flex-direction:column; align-items:center; gap:16px}
.fc{width:100%; max-width:440px; min-height:210px; border-radius:var(--r-l); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-2); display:grid; place-items:center; padding:24px; text-align:center; gap:10px}
.fc .fc-main{font-family:var(--font-en); font-weight:700; font-size:32px; line-height:1.2; word-break:break-word}
.fc .fc-main.zh{font-family:var(--font-zh); font-size:28px}
.fc .fc-sub{font-size:17px; color:var(--ink-2); min-height:24px}
.fc .fc-hint{font-size:12px; color:var(--ink-3); letter-spacing:.06em}
.fc-bar{display:flex; align-items:center; gap:10px; width:100%; max-width:440px}
.fc-bar .count{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; flex:none}

.btn{border:1px solid var(--line-2); background:var(--surface); color:var(--ink); border-radius:12px; padding:11px 18px; font-size:15px; min-height:48px; font-weight:500}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.btn.primary:hover{filter:brightness(1.08); color:var(--on-accent)}
.btn.small{padding:7px 12px; font-size:13px; min-height:38px; border-radius:10px}
.btn.wide{width:100%}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}

/* ---------- quiz ---------- */
.quiz{max-width:540px; margin:0 auto}
.qprog{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.qprog .bar{max-width:none; flex:1; margin:0; height:6px}
.qprog .bar i{background:var(--accent)}
.qprog span{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; flex:none}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:22px; box-shadow:var(--shadow-1)}
.qkind{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.qtext{margin:8px 0 18px; font-size:21px; line-height:1.45; text-wrap:balance}
.opts{display:grid; gap:9px}
.opt{text-align:left; width:100%; background:var(--surface-3); border:1.5px solid var(--line); border-radius:12px; padding:13px 16px; font-size:16px; min-height:52px}
.opt.en{font-family:var(--font-en)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:700}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.feedback{margin-top:14px; font-size:14px; padding:11px 14px; border-radius:12px; display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-soft); color:var(--good)}
.feedback.no{background:var(--bad-soft); color:var(--bad)}
.result{text-align:center; padding:26px 20px}
.result .big{font-family:var(--font-display); font-size:52px; line-height:1; font-variant-numeric:tabular-nums}
.result .msg{margin:10px 0 20px; color:var(--ink-2)}

/* ---------- spelling ---------- */
.sp-target{text-align:center; margin-bottom:12px}
.sp-target .zh{font-size:24px; font-weight:700}
.sp-slots{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:18px 0; min-height:52px}
.slot{width:36px; height:48px; border-radius:9px; border:2px dashed var(--line-2); display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:22px; background:var(--surface-3)}
.slot.gap{border:0; background:none; width:14px}
.slot.filled{border-style:solid; border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.sp-pool{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.tile{width:42px; height:48px; border-radius:10px; border:1.5px solid var(--line-2); background:var(--surface); font-family:var(--font-en); font-weight:700; font-size:22px}
.tile:disabled{opacity:.28}

/* ---------- tables & forms ---------- */
.ptable{width:100%; border-collapse:collapse; font-size:14px}
.ptable th,.ptable td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left}
.ptable th{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.ptable td.num{text-align:right; font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.pill{display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; font-weight:700; white-space:nowrap}
.ptable td,.ptable th{white-space:nowrap}
.ptable td:first-child{white-space:normal; min-width:130px}
.pill.ok{background:var(--good-soft); color:var(--good)}
.pill.mid{background:var(--gold-soft); color:var(--gold)}
.pill.no{background:var(--surface-2); color:var(--ink-3)}

.form{display:grid; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px}
.field{display:grid; gap:5px}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-2)}
.field input,.field select,.field textarea{font:inherit; font-size:15px; color:var(--ink); background:var(--surface-3); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; min-height:46px; width:100%}
.field textarea{min-height:76px; resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent); outline:none}
.two{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.item{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px}
.item .imain{flex:1; min-width:0}
.item .imain .is{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.del{background:none; border:0; color:var(--ink-3); font-size:13px; padding:6px 8px; border-radius:8px}
.del:hover{color:var(--bad); background:var(--bad-soft)}

.status{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:40; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-size:14px; box-shadow:var(--shadow-2); opacity:0; pointer-events:none; transition:opacity .18s ease}
.status.show{opacity:1}

/* ============================================================

   ============================================================ */

const state = {
  view:"home", subject:null, unit:null, week:null, tab:"ref", entab:"week",
  progress:{}, custom:{words:[], questions:[]}, db:null,
  updatedAt:0, sync:SYNC_URL ? "connecting" : "off"
};
const LS_KEY = "cindy-study-v2";

function snapshot(){
  return {progress:state.progress, custom:state.custom, updatedAt:state.updatedAt};
}
function applySnapshot(o){
  if(!o || typeof o !== "object") return false;
  state.progress = o.progress || {};
  state.custom = {words:(o.custom && o.custom.words) || [], questions:(o.custom && o.custom.questions) || []};
  state.updatedAt = o.updatedAt || 0;
  return true;
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); }catch(e){}
}

/* 自架同步：Firebase Realtime Database 的 REST 介面，不需要任何 SDK */
async function pullRemote(){
  if(!SYNC_URL) return null;
  const res = await fetch(SYNC_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function pushRemote(){
  if(!SYNC_URL) return;
  const res = await fetch(SYNC_URL, {
    method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(snapshot())
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
}
async function syncNow(loud){
  if(!SYNC_URL) return;
  try{
    const remote = await pullRemote();
    if(remote && (remote.updatedAt || 0) > state.updatedAt){
      applySnapshot(remote); saveLocal();
      state.sync = "ok";
      if(loud) toast("已從雲端取得較新的進度");
      render();
      return;
    }
    await pushRemote();
    state.sync = "ok";
    if(loud){ toast("同步完成"); render(); }
  }catch(e){
    state.sync = "error";
    if(loud){ toast("同步失敗，請檢查同步網址"); render(); }
  }
}

let saveTimer = null;
function save(){
  state.updatedAt = Date.now();
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(state.db){
      try{
        await state.db.doc("study/progress").set({units:state.progress, updatedAt:new Date().toISOString()});
        await state.db.doc("study/custom").set({words:state.custom.words, questions:state.custom.questions});
      }catch(e){
        toast(e && e.code === "quota_exceeded" ? "儲存空間已滿，請先刪掉一些自訂題目" : "這次沒存到雲端，資料留在這台裝置");
      }
    }
    if(SYNC_URL){
      try{ await pushRemote(); state.sync = "ok"; }catch(e){ state.sync = "error"; }
    }
  }, 600);
}
async function initDb(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  let db = null;
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  state.db = db;
  try{
    const [p, c] = await Promise.all([db.doc("study/progress").get(), db.doc("study/custom").get()]);
    if(p.exists) state.progress = Object.assign({}, (p.data().units)||{}, state.progress);
    if(c.exists){ const d = c.data(); state.custom = {words:d.words||[], questions:d.questions||[]}; }
    saveLocal(); render();
  }catch(e){}
}

const $ = (s, r)=> (r||document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

let toastTimer = null;
function toast(msg){
  const el = $("#status"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
}
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u);
  }catch(e){}
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtRange(w){
  const f = s => s.slice(5).replace("-","/");
  return f(w.s) + "–" + f(w.e);
}
function currentWeek(){
  const t = todayISO();
  for(const w of WEEKS){ if(t >= w.s && t <= w.e) return w; }
  if(t < WEEKS[0].s) return WEEKS[0];
  if(t > WEEKS[WEEKS.length-1].e) return WEEKS[WEEKS.length-1];
  // 落在兩週之間（例如跨年假期）：取下一個尚未開始的週次
  const next = WEEKS.find(w => t < w.s);
  return next || WEEKS[WEEKS.length-1];
}
function sentenceOfWeek(){
  const w = currentWeek();
  return SENTENCES.find(s => s[0] === w.n) || SENTENCES[0];
}

/* progress helpers */
function pget(k){ return state.progress[k] || {}; }
function pset(k, patch){ state.progress[k] = Object.assign({}, state.progress[k], patch); save(); }
const wordWeeks = WEEKS.filter(w => w.words.length);
function weekPct(){
  const done = wordWeeks.filter(w => pget("wk"+w.n).learned).length;
  return Math.round(done / wordWeeks.length * 100);
}
function sentDone(){ return (pget("sent").done) || {}; }
function sentPct(){ return Math.round(Object.keys(sentDone()).length / SENTENCES.length * 100); }
function unitScore(n){
  const p = pget("u"+n); let d = 0;
  if(p.ref) d++; if(p.cards) d++; if((p.quiz||0)>=60) d++; if((p.spell||0)>=60) d++;
  return d;
}

/* word sources */
function schoolWordsForUnit(u){
  const out = [];
  u.weeks.forEach(n => {
    const w = WEEKS.find(x => x.n === n);
    if(w) w.words.forEach(p => out.push({en:p[0], zh:p[1]}));
  });
  return out;
}
function customWords(unitN){
  return state.custom.words
    .filter(w => w.subject === "english" && String(w.unit) === String(unitN))
    .map(w => ({en:w.en, zh:w.zh, mine:true}));
}
function unitAllWords(u){
  const seen = {}, out = [];
  const push = w => { const k = w.en.toLowerCase(); if(!seen[k]){ seen[k]=1; out.push(w); } };
  schoolWordsForUnit(u).forEach(push);
  if(u.v1) u.v1.words.forEach(p => push({en:p[0], zh:p[1]}));
  if(u.v2) u.v2.words.forEach(p => push({en:p[0], zh:p[1]}));
  customWords(u.n).forEach(push);
  return out;
}
const ALL_SCHOOL_WORDS = (()=>{ const a=[]; WEEKS.forEach(w => w.words.forEach(p => a.push({en:p[0], zh:p[1]}))); return a; })();

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!HAN.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      let p = n.parentElement;
      while(p){
        if(ZY_SKIP[p.tagName] || p.classList.contains("zy") || p.hasAttribute("data-nozy")) return NodeFilter.FILTER_REJECT;
        if(p === root) break;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(HAN_RUN).forEach(part => {
      if(!part) return;
      if(!HAN.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
      const reads = zyRead(part);
      for(let i = 0; i < part.length; i++){
        const box = document.createElement("span"); box.className = "zy";
        const ch = document.createElement("span"); ch.className = "zy-c"; ch.textContent = part.charAt(i);
        const rt = document.createElement("span"); rt.className = "zy-r"; rt.textContent = zyTidy(reads[i] || "");
        box.appendChild(ch); box.appendChild(rt); frag.appendChild(box);
      }
    });
    n.parentNode.replaceChild(frag, n);
  });
}

/* 畫面內容隨時在變（測驗回饋、閃卡翻面…），用 MutationObserver 自動補上注音 */
let zyQueued = false;
function zyWatch(el){
  if(!el || !window.MutationObserver) return;
  new MutationObserver(() => {
    if(!zyOn || zyQueued) return;
    zyQueued = true;
    requestAnimationFrame(() => { zyQueued = false; zyApply(el); });
  }).observe(el, {childList:true, subtree:true, characterData:true});
}

function ringSvg(pct, color){
  const r=30, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="8"></circle>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color||"var(--gold)"}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 38 38)"></circle></svg>`;
}

function makeCards(panel, words, onComplete){
  if(!words.length){ panel.innerHTML = `<div class="note">這裡還沒有單字。</div>`; return; }
  const list = shuffle(words);
  let i = 0, flipped = false, mode = "en";
  panel.innerHTML = `<div class="fc-wrap">
    <div class="btn-row" style="justify-content:center">
      <button class="btn small" data-mode="en">先看英文</button>
      <button class="btn small" data-mode="zh">先看中文</button></div>
    <button class="fc" id="card"></button>
    <div class="fc-bar">
      <button class="btn" id="prev" style="flex:1">← 上一張</button>
      <span class="count" id="cnt"></span>
      <button class="btn primary" id="next" style="flex:1">下一張 →</button></div>
    <button class="btn small" id="say">🔊 唸這個字</button></div>`;
  const card = $("#card");
  function draw(){
    const w = list[i], showEn = (mode === "en") !== flipped;
    card.innerHTML = showEn
      ? `<div><div class="fc-main">${esc(w.en)}</div><div class="fc-sub"></div><div class="fc-hint">點卡片看中文</div></div>`
      : `<div><div class="fc-main zh">${esc(w.zh)}</div><div class="fc-sub en">${flipped && mode==="en" ? "" : (flipped ? esc(w.en) : "")}</div><div class="fc-hint">點卡片翻面</div></div>`;
    $("#cnt").textContent = (i+1) + " / " + list.length;
  }
  card.onclick = () => { flipped = !flipped; draw(); speak(list[i].en); };
  $("#prev").onclick = () => { i = (i-1+list.length)%list.length; flipped = false; draw(); };
  $("#next").onclick = () => {
    if(i === list.length-1 && onComplete) onComplete();
    i = (i+1)%list.length; flipped = false; draw();
  };
  panel.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; flipped = false; draw(); });
  $("#say").onclick = () => speak(list[i].en);
  draw();
}

function buildWordQuiz(words, pool, extraQs, count){
  const items = [];
  words.forEach(w => {
    const others = shuffle(pool.filter(x => x.en !== w.en && x.zh !== w.zh)).slice(0,2);
    if(others.length < 2) return;
    items.push({kind:"英翻中", q:`<span class="en">${esc(w.en)}</span> 的意思是？`,
      o:[w.zh].concat(others.map(x=>x.zh)), a:0, why:`${w.en} ＝ ${w.zh}`, say:w.en});
    items.push({kind:"中翻英", q:`「${esc(w.zh)}」的英文是？`,
      o:[w.en].concat(others.map(x=>x.en)), a:0, why:`${w.zh} ＝ ${w.en}`, say:w.en, enOpts:true});
  });
  (extraQs||[]).forEach(g => items.push({kind:g.mine ? "媽媽出題" : "句型", q:g.q, o:g.o, a:g.a, why:g.why}));
  return shuffle(items).slice(0, count).map(it => {
    const correct = it.o[it.a], opts = shuffle(it.o);
    return Object.assign({}, it, {o:opts, a:opts.indexOf(correct)});
  });
}

function startChallenge(){
  const all = [];
  UNITS.filter(u => u.term === 1).forEach(u => {
    const w = unitAllWords(u);
    if(w.length >= 3) all.push.apply(all, buildWordQuiz(w, ALL_SCHOOL_WORDS, unitQuestions(u), 4));
  });

    <div class="page-head"><h2>綜合大挑戰</h2><p>從本學期 Unit 0–4 隨機抽 12 題，看看記得多少。</p></div>

function runQuiz(panel, qs, label, onDone, onBack){
  if(!qs.length){ panel.innerHTML = `<div class="note">題目還不夠，先去看單字表吧。</div>`; return; }
  let i = 0, right = 0, answered = false;
  panel.innerHTML = `<div class="quiz">
    <div class="qprog"><span class="bar"><i id="qbar" style="width:0%"></i></span><span id="qnum"></span></div>
    <div class="qcard" id="qcard"></div></div>`;
  const bar = $("#qbar"), num = $("#qnum"), card = $("#qcard");

  function draw(){
    const q = qs[i]; answered = false;
    bar.style.width = (i / qs.length * 100) + "%";
    num.textContent = (i+1) + "/" + qs.length;
    card.innerHTML = `<div class="qkind">${esc(q.kind || "題目")}</div>
      <p class="qtext">${q.q}</p>
      <div class="opts">${q.o.map((o,k) =>
        `<button class="opt ${q.enOpts?"en":""}" data-i="${k}">${esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <div class="btn-row" style="margin-top:14px; display:none" id="nr">
        <button class="btn primary wide" id="nb">${i === qs.length-1 ? "看成績" : "下一題"}</button></div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(Number(b.dataset.i)));
    $("#nb").onclick = () => { i++; if(i < qs.length) draw(); else finish(); };
  }
  function choose(idx){
    if(answered) return; answered = true;
    const q = qs[i];
    card.querySelectorAll(".opt").forEach((b,k) => {
      b.disabled = true;
      if(k === q.a) b.classList.add("right");
      else if(k === idx) b.classList.add("wrong");
    });
    const ok = idx === q.a; if(ok) right++;
    const fb = $("#fb");
    fb.className = "feedback show " + (ok ? "ok" : "no");
    fb.textContent = (ok ? "答對了！" : "再看一次：") + (q.why || "");
    if(q.say) speak(q.say);
    $("#nr").style.display = "flex";
  }
  function finish(){
    const score = Math.round(right / qs.length * 100);
    bar.style.width = "100%"; num.textContent = qs.length + "/" + qs.length;
    const msg = score === 100 ? "全部答對，太厲害了！"
      : score >= 80 ? "很棒！只差一點點就滿分。"
      : score >= 60 ? "有進步，再練一次會更好。" : "先回去看單字表，再來挑戰一次。";
    card.innerHTML = `<div class="result"><div class="qkind">${esc(label)}</div>
      <div class="big">${score}<span style="font-size:22px">分</span></div>
      <p class="msg">答對 ${right} / ${qs.length} 題。${msg}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" id="ag">再做一次</button>
        <button class="btn" id="bk">回上一頁</button></div></div>`;
    onDone(score);
    $("#ag").onclick = () => { i = 0; right = 0; draw(); };
    $("#bk").onclick = onBack;
  }
  draw();
}

function makeSpell(panel, words, onDone, onBack){
  const items = words.filter(w => /^[a-zA-Z ]{3,14}$/.test(w.en));
  if(items.length < 3){ panel.innerHTML = `<div class="note">這裡的字不適合拼字練習，換個單元或週次試試。</div>`; return; }
  const list = shuffle(items).slice(0, Math.min(8, items.length));
  let i = 0, right = 0;
  panel.innerHTML = `<div class="quiz">
    <div class="qprog"><span class="bar"><i id="sbar" style="width:0%"></i></span><span id="snum"></span></div>
    <div class="qcard" id="scard"></div></div>`;
  const bar = $("#sbar"), num = $("#snum"), card = $("#scard");

  function draw(){
    const w = list[i];
    const target = w.en.toLowerCase();
    const letters = shuffle(target.replace(/ /g,"").split(""));
    let built = [];
    bar.style.width = (i / list.length * 100) + "%";
    num.textContent = (i+1) + "/" + list.length;
    card.innerHTML = `<div class="qkind">把字母排成正確的單字</div>
      <div class="sp-target"><div class="zh">${esc(w.zh)}</div>
        <button class="btn small" id="hear" style="margin-top:8px">🔊 聽一次</button></div>
      <div class="sp-slots" id="slots"></div>
      <div class="sp-pool" id="pool">${letters.map((L,k) => `<button class="tile" data-k="${k}">${esc(L)}</button>`).join("")}</div>
      <div class="feedback" id="sfb"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn small" id="clr">清除</button>
        <button class="btn small" id="skp">看答案</button></div>`;
    const slots = $("#slots"), pool = $("#pool"), fb = $("#sfb");
    $("#hear").onclick = () => speak(w.en);
    const shape = target.split("");
    function drawSlots(){
      let bi = 0;
      const html = shape.map(ch => {
        if(ch === " ") return `<span class="slot gap"></span>`;
        const letter = built[bi];
        bi++;
        return `<span class="slot ${letter ? "filled" : ""}">${letter ? esc(letter) : ""}</span>`;
      });
      slots.innerHTML = html.join("");
    }
    function check(){
      const need = target.replace(/ /g,"");
      if(built.length !== need.length) return;
      const ok = built.join("") === need;
      fb.className = "feedback show " + (ok ? "ok" : "no");
      if(ok){ right++; speak(w.en); fb.textContent = `${w.en} — 拼對了！`; setTimeout(next, 900); }
      else fb.textContent = "再試一次，把字母清掉重排看看。";
    }
    function next(){
      i++;
      if(i < list.length) return draw();
      const score = Math.round(right / list.length * 100);
      bar.style.width = "100%"; onDone(score);
      card.innerHTML = `<div class="result"><div class="qkind">拼字練習</div>
        <div class="big">${score}<span style="font-size:22px">分</span></div>
        <p class="msg">拼對 ${right} / ${list.length} 個單字。</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn primary" id="ag2">再練一次</button>
          <button class="btn" id="bk2">回上一頁</button></div></div>`;
      $("#ag2").onclick = () => makeSpell(panel, words, onDone, onBack);
      $("#bk2").onclick = onBack;
    }
    pool.querySelectorAll(".tile").forEach(b => b.onclick = () => {
      if(b.disabled || built.length >= target.replace(/ /g,"").length) return;
      b.disabled = true; built.push(b.textContent); drawSlots(); check();
    });
    $("#clr").onclick = () => { built = []; pool.querySelectorAll(".tile").forEach(b => b.disabled = false); fb.className = "feedback"; drawSlots(); };
    $("#skp").onclick = () => { fb.className = "feedback show no"; fb.textContent = `答案是 ${w.en}`; speak(w.en); setTimeout(next, 1500); };
    drawSlots();
  }
  draw();
}

    const en = $("#we").value.trim(), zh = $("#wz").value.trim();
    if(!en || !zh) return toast("英文和中文都要填");
    state.custom.words.push({id:uid(), subject:$("#ws").value, unit:$("#wu").value, en, zh});
    save(); toast("單字加好了"); renderParent();
  };
  $("#qf").onsubmit = e => {
    e.preventDefault();
    const q = $("#qq").value.trim(), a = $("#qa").value.trim();
    if(!q || !a) return toast("題目和答案都要填");
    const opts = $("#qw").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    state.custom.questions.push({id:uid(), subject:$("#qs").value, unit:$("#qu").value, q, a, opts, note:$("#qn").value.trim()});
    save(); toast(opts.length >= 2 ? "選擇題加好了，會出現在測驗裡" : "題目加好了（選項不足兩個，不會進測驗）"); renderParent();
  };
  app.querySelectorAll("[data-dw]").forEach(b => b.onclick = () => {
    state.custom.words = state.custom.words.filter(w => w.id !== b.dataset.dw); save(); renderParent(); });
  app.querySelectorAll("[data-dq]").forEach(b => b.onclick = () => {
    state.custom.questions = state.custom.questions.filter(q => q.id !== b.dataset.dq); save(); renderParent(); });
}
function subjName(id){ const s = SUBJECTS.find(x => x.id === id); return s ? s.name : id; }
function syncLabel(){
  if(state.db) return "已連上 Claude 雲端，換裝置也看得到。";
  if(!SYNC_URL) return "只存在這台裝置。要跨裝置自動同步，請在 HTML 最上面的 SYNC_URL 填入同步網址。";
  if(state.sync === "ok") return "自動同步中（你設定的同步網址）。";
  if(state.sync === "error") return "同步網址連不上，資料暫時只存在這台裝置。";
  return "正在連線…";
}

/* ============================================================ */
const topbarEl = document.querySelector(".topbar");
const topbarHTML = topbarEl.innerHTML;

function bindTopbar(){
  document.querySelectorAll("#topnav button[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const t = document.querySelector("#zytoggle");
  t.setAttribute("aria-pressed", String(zyOn));
  t.onclick = () => {
    zyOn = !zyOn;
    document.body.classList.toggle("zy-on", zyOn);
    try{ localStorage.setItem("cindy-zhuyin", zyOn ? "on" : "off"); }catch(e){}
    topbarEl.innerHTML = topbarHTML;   /* 先還原成沒有注音的版本 */
    bindTopbar();
    if(zyOn) zyApply(topbarEl);
    render();
    toast(zyOn ? "注音已開啟" : "注音已關閉");
  };
}

loadLocal();
bindTopbar();
document.body.classList.toggle("zy-on", zyOn);
render();
zyApply(topbarEl);
zyApply(document.querySelector("#status"));
zyWatch(app);
zyWatch(document.querySelector("#status"));
initDb();
if(SYNC_URL) syncNow(false);
</script>
